<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
    .card {
      width: min(380px, 100%);
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #f0f1f3;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.12);
      padding: 28px 28px 24px;
    }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 18px;
    }
    .brand-mark {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }
    .brand-mark span {
      width: 54px;
      height: 9px;
      border-radius: 4px;
      background: linear-gradient(180deg, #20a77d, #08795e);
    }
    .brand-mark span:nth-child(2) { opacity: 0.82; }
    .brand-mark span:nth-child(3) { opacity: 0.64; }
    .brand-name {
      margin: 0;
      color: #08795e;
      font-size: 1.35rem;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 20px;
      text-align: center;
      color: #111111;
      font-size: 1.9rem;
    }
    label {
      display: block;
      margin-bottom: 14px;
      font-size: 0.9rem;
      color: #4b5563;
    }
    .field-input {
      width: 100%;
      height: 44px;
      margin-top: 6px;
      padding: 0 12px;
      border: 1px solid #d5deea;
      border-radius: 4px;
      font: inherit;
      font-size: 0.9rem;
      outline: none;
    }
    .field-input:focus {
      border-color: #0b8063;
      box-shadow: 0 0 0 3px rgba(11, 128, 99, 0.12);
    }
    .option-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 8px 0;
      color: #4b5563;
      font-size: 0.88rem;
    }
    .option-row input {
      width: 17px;
      height: 17px;
      margin: 0;
      accent-color: #0b8063;
    }
    button {
      width: 100%;
      height: 44px;
      margin-top: 10px;
      border: none;
      border-radius: 4px;
      background: #0b8063;
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover {
      background: #086b53;
    }
    .status {
      min-height: 0;
      margin-top: 0;
      color: #1d4ed8;
      font-size: 0.92rem;
      text-align: center;
    }
    .status.error {
      color: #b91c1c;
    }
    .status:not(:empty) {
      min-height: 24px;
      margin-top: 12px;
    }
    @media (max-width: 520px) {
      body { padding: 16px; }
      .card { padding: 24px 22px 20px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand" aria-label="Shelfware">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="brand-name">SHELFWARE</p>
    </div>
    <h1>Sign In</h1>

    <form id="loginForm" autocomplete="on">
      <label>
        School Email
        <input class="field-input" id="email" type="email" name="email" placeholder="you@example.com" required />
      </label>

      <label>
        Password
        <input class="field-input" id="password" type="password" name="password" placeholder="•••••••" required />
      </label>

      <label class="option-row">
        <input id="showPassword" type="checkbox" />
        <span>Show password</span>
      </label>

      <label class="option-row">
        <input id="rememberMe" type="checkbox" />
        <span>Remember me</span>
      </label>

      <button type="submit">Login</button>
      <div id="status" class="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const supabaseUrl = 'https://ietshavvsbgpefkzrwgc.supabase.co';
    const supabasePublishableKey = 'sb_publishable_cFRBKsCDEjq3wzlgbO7C0g_KQQdpw-A';
    const form = document.getElementById('loginForm');
    const status = document.getElementById('status');
    const password = document.getElementById('password');
    const showPassword = document.getElementById('showPassword');
    const submitButton = form.querySelector('button[type="submit"]');

    showPassword.addEventListener('change', () => {
      password.type = showPassword.checked ? 'text' : 'password';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const passwordValue = password.value;

      status.textContent = 'Signing in...';
      status.classList.remove('error');
      submitButton.disabled = true;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);

      try {
        const response = await fetch(`${supabaseUrl}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          signal: controller.signal,
          headers: {
            'Content-Type': 'application/json',
            apikey: supabasePublishableKey
          },
          body: JSON.stringify({ email, password: passwordValue })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.msg || result.message || 'Unable to sign in. Check your email and password.');
        }

        sessionStorage.setItem('isLoggedIn', 'true');
        window.location.href = '/dashboard';
      } catch (error) {
        status.textContent = error.name === 'AbortError'
          ? 'Supabase did not respond. Check your connection and try again.'
          : error.message;
        status.classList.add('error');
        submitButton.disabled = false;
      } finally {
        clearTimeout(timeoutId);
      }
    });
  </script>
</body>
</html>
